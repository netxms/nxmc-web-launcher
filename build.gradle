plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'distribution'
}

group = 'org.netxms'

repositories {
    mavenCentral()
}

kotlin {
    jvmToolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

def slf4jVersion = '2.0.18'
def junitVersion = '6.1.3'
def jettyVersion = '12.1.12'
def hopliteVersion = '2.9.0'

dependencies {
    implementation('com.github.ajalt.clikt:clikt:5.1.0')

    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "org.slf4j:slf4j-simple:${slf4jVersion}"

    implementation "org.eclipse.jetty:jetty-server:${jettyVersion}"
    implementation "org.eclipse.jetty.ee10:jetty-ee10-servlet:${jettyVersion}"
    implementation "org.eclipse.jetty.ee10:jetty-ee10-webapp:${jettyVersion}"
    implementation "org.eclipse.jetty.compression:jetty-compression-server:${jettyVersion}"
    implementation "org.eclipse.jetty.compression:jetty-compression-gzip:${jettyVersion}"

    implementation "com.sksamuel.hoplite:hoplite-core:${hopliteVersion}"
    implementation "com.sksamuel.hoplite:hoplite-toml:${hopliteVersion}"

    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
}

processResources {
    def projectVersion = project.version.toString()
    filesMatching('version.properties') {
        expand(version: projectVersion)
    }
}

test {
    useJUnitPlatform()
}

jar {
    archiveFileName = "launcher.jar"
    manifest {
        attributes "Main-Class": "org.netxms.web.LauncherKt"
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    if (file("nxmc.war").exists()) {
        from(zipTree("nxmc.war")) {
            into('/META-INF/webapps/nxmc')
        }
    }
    if (file("api.war").exists()) {
        from(zipTree("api.war")) {
            into('/META-INF/webapps/nxmc')
        }
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

distributions {
    solaris {
        contents {
            from jar
        }
    }

    macosx_aarch64 {
        contents {
            from jar
        }
    }

    aix {
        contents {
            from jar
        }
    }
}

tasks.withType(Tar) {
    compression = Compression.GZIP
    archiveExtension = 'tar.gz'
}

tasks.matching { it.name.endsWith('DistZip') }.configureEach { enabled = false }
